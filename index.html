<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worship">
<meta name="format-detection" content="telephone=no">
<title>Worship</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#13110e;--s1:#1b1814;--s2:#262119;--line:#332e25;--line2:#52493a;
  --tx:#f0e9dc;--mu:#a29886;--ac:#f0a83a;--acx:#1d1406;--acs:rgba(240,168,58,.13);
  --ok:#86b66f;--bad:#ee6f62;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --ser:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
[data-theme=light]{
  --bg:#f5f0e4;--s1:#fffcf4;--s2:#ece5d4;--line:#ddd3bc;--line2:#aa9d82;
  --tx:#211b10;--mu:#6b614f;--ac:#a35a00;--acx:#fff8e8;--acs:rgba(163,90,0,.10);
  --ok:#3d7a38;--bad:#b13428;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 4px) var(--sar) 24px var(--sal)}
.page{max-width:900px;margin:0 auto;padding:0 16px}
.page.wide{max-width:1180px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 0}
.hdr h1{flex:1;min-width:0;margin:0;font:600 28px/1.1 var(--ser);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr h1.sm{font-size:22px}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--tx)}
.ib:active{background:var(--s2)}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--s1);font-size:13px;color:var(--mu);max-width:58vw}
.pill span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}
.pill.ok .dot{background:var(--ok)}.pill.saving .dot{background:var(--ac);animation:pulse 1s infinite}
.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.bad .dot{background:var(--bad)}
.pill.nc{border-style:dashed;color:var(--tx)}
@keyframes pulse{50%{opacity:.3}}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.eyebrow.ac{color:var(--ac)}
h2.sec{margin:26px 0 10px;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
p.mu{color:var(--mu);margin:6px 0}
.small{font-size:13px}

/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:var(--s1);color:var(--tx);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{background:var(--s2)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn.pri:active{filter:brightness(.92)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:12px}

/* cards, lists */
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card+.card{margin-top:10px}
button.card{display:block;width:100%;text-align:left}
button.card:active{background:var(--s2)}
.set-card .d{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.set-card .n{font:600 22px/1.2 var(--ser);margin:6px 0 2px}
.set-card .m{color:var(--mu);font-size:14px}
.badge{display:inline-block;margin-top:8px;font-size:12px;color:var(--mu);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.li{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
button.li:active{background:var(--s2)}
.li .num{width:26px;font:600 15px var(--mono);color:var(--mu);text-align:center;flex:none}
.li .tt{font:600 18px/1.2 var(--ser)}
.li .mm{font-size:13px;color:var(--mu);margin-top:2px}
.li.cue .tt{font:italic 500 17px var(--ser);color:var(--ac)}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border-radius:8px;background:var(--s2);font-size:13px;color:var(--tx);white-space:nowrap}
.chip.key{font:700 14px var(--mono);background:var(--acs);color:var(--ac)}
.chip.hot{background:var(--ac);color:var(--acx);font-weight:700}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.chip.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* forms */
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
input[type=text],input[type=search],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:10px 12px;font-size:16px;color:var(--tx);appearance:none;-webkit-appearance:none}
input[type=date]{min-width:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{resize:vertical;line-height:1.45}
textarea.mono{font-family:var(--mono);font-size:16px;white-space:pre;overflow-x:auto;tab-size:2}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:24px;height:24px;accent-color:var(--ac)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 14px;border:0;background:transparent;font-size:14px;font-weight:600}
.seg button.on{background:var(--ac);color:var(--acx)}

/* tab bar */
#tabbar{display:flex;border-top:1px solid var(--line);background:var(--s1);padding:0 var(--sar) var(--sab) var(--sal)}
#tabbar button{flex:1;min-height:56px;border:0;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.04em}
#tabbar button.on{color:var(--ac)}
body.share #tabbar{display:none}

/* sheet, toast */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--sab));-webkit-overflow-scrolling:touch}
.sheet h3{margin:0 0 4px;font:600 22px var(--ser)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line);padding-bottom:18px}}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);z-index:120;max-width:min(92vw,520px);background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 6px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.empty{text-align:center;padding:36px 10px;color:var(--mu)}
.empty h3{font:600 22px var(--ser);color:var(--tx);margin:0 0 6px}

/* chart */
.chart{--fs:22px;font-size:var(--fs);color:var(--tx)}
.chart .csec{display:grid;grid-template-columns:calc(var(--fs)*3.4) minmax(0,1fr);column-gap:.5em;padding:.3em 0;border-bottom:1px solid var(--line);align-items:start;break-inside:avoid}
.chart.narrow .csec{grid-template-columns:minmax(0,1fr)}
.chart .clab{display:flex;align-items:baseline;gap:.5em;padding-top:.32em;min-width:0}
.chart .cn{font:600 max(.36em,11px)/1.1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.chart .crep{font:700 max(.4em,12px) var(--mono);color:var(--ac)}
.chart .cbars{display:grid;grid-template-columns:repeat(4,minmax(max-content,1fr));min-width:0}
.chart .bar{display:flex;justify-content:center;gap:.65em;padding:.18em .35em;box-shadow:inset 2px 0 0 var(--line2);font:700 1em/1.25 var(--mono);white-space:nowrap}
.chart .bar:nth-child(4n),.chart .bar:last-child{box-shadow:inset 2px 0 0 var(--line2),inset -2px 0 0 var(--line2)}
.chart .bar:nth-child(4n+1):not(:nth-child(4n)):last-child{box-shadow:inset 2px 0 0 var(--line2),inset -2px 0 0 var(--line2)}
.chart .ch.nc{color:var(--mu);font-weight:500}
.chart .pm{font-style:normal;color:var(--ac);font-weight:700}
.chart .ccue{grid-column:2;font:italic 500 max(.5em,13px)/1.25 var(--ser);color:var(--ac);padding:.1em .3em 0}
.chart.narrow .ccue{grid-column:1}
.chart .cmod{display:flex;align-items:baseline;gap:.7em;padding:.35em 0;border-bottom:1px solid var(--line)}
.chart .cmod .lbl{font:600 max(.36em,11px) var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.chart .cmod .ckey{font:800 1.1em var(--mono);color:var(--ac)}
.chart .ctext{font:italic 500 max(.5em,13px) var(--ser);color:var(--mu);padding:.3em 0}
.chart.cols2x{column-count:2;column-gap:2.2em}
.chart.cols2x .csec,.chart.cols2x .cmod{break-inside:avoid}
.chart.nums .bar{letter-spacing:.02em}
.chart.small{--fs:18px}
.chart .csec[data-jump]{cursor:pointer}
.chart .csec.hasmark .cn::after{content:" \25B6";color:var(--ac);font-size:.9em}

/* stage */
#stage{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.st-top{display:flex;align-items:center;gap:2px;padding:4px 6px;min-height:52px}
.st-top .ttl{flex:1;min-width:0;padding:0 6px;font:600 12px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-top .ib.on{background:var(--acs);color:var(--ac)}
.st-top .ib.txt{width:auto;min-width:44px;padding:0 10px;font:700 15px var(--mono)}
.st-top .lock{color:var(--ok);width:30px}
.st-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 8px;scrollbar-width:none}
.st-strip::-webkit-scrollbar{display:none}
.st-strip button{flex:none;min-height:44px;max-width:210px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--s1);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-strip button.cue{font-style:italic;font-weight:500;color:var(--ac)}
.st-strip button.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.st-body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;margin:0 max(44px,9vw)}
.st-head{padding:2px 0 8px}
.st-head .l1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.st-head h1{margin:0;font:600 clamp(26px,5.2vw,52px)/1.05 var(--ser);letter-spacing:-.015em}
.st-head .keybox{font:800 clamp(24px,4.6vw,44px)/1 var(--mono);color:var(--ac);white-space:nowrap}
.st-head .keybox small{font-size:.5em;color:var(--mu);font-weight:600;margin-left:.3em}
.st-head .l2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.st-head .chip{font-size:clamp(13px,2.2vw,17px);min-height:30px;padding:0 11px}
.st-chart{flex:1;min-height:0;overflow:hidden;position:relative}
.st-chart.scroll{overflow-y:auto}
.st-foot{padding:8px 0 10px;min-height:48px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:clamp(14px,2.2vw,18px)}
.st-foot b{font:600 1.1em var(--ser)}
.st-foot .tr{color:var(--ac);font-style:italic;font-family:var(--ser)}
.st-foot .nx{color:var(--mu);font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.st-zone{position:absolute;top:100px;bottom:0;width:max(44px,9vw);border:0;background:transparent;color:var(--line2);display:grid;place-items:center;z-index:3}
.st-zone.l{left:var(--sal)}.st-zone.r{right:var(--sar)}
.st-zone:active{background:var(--acs)}
.st-zone[disabled]{opacity:.25;pointer-events:none}
.st-zone svg{width:28px;height:28px}
.st-cue{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.st-cue .big{font:600 clamp(48px,14vw,150px)/1 var(--ser);color:var(--ac);letter-spacing:-.02em}
.st-cue .sub{font:600 14px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.st-nochart{flex:1;display:grid;place-items:center;text-align:center;color:var(--mu);padding:20px}

/* editor */
.ed-grid{display:block}
@media (min-width:980px){.ed-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}}
.ed-title{font:600 28px var(--ser)!important;min-height:54px!important}
.ce{margin-top:6px}
.ce-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.ce-row::-webkit-scrollbar{display:none}
.ce-row button{flex:none;min-height:44px;min-width:44px;padding:0 13px;border-radius:12px;border:1px solid var(--line2);background:var(--s1);font-weight:700}
.ce-row button.ch{font-family:var(--mono);font-size:16px}
.ce-row button.sc{font-size:13px;font-weight:600}
.ce-row button.fn{font-family:var(--mono);color:var(--ac)}
.ce-row button:active{background:var(--ac);color:var(--acx)}
.ce-prev{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:6px 14px 10px;background:var(--s1);min-height:60px}
.ce-prev .eyebrow{display:block;margin:8px 0 2px}
.bpmbox{display:flex;gap:8px}
.tap{min-width:96px}

/* practice */
.pr-grid{display:block}
@media (min-width:980px){.pr-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:26px;align-items:start}}
.ytbox{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.ytbox iframe,.ytbox>div{position:absolute;inset:0;width:100%;height:100%}
.ytmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;background:var(--s1);color:var(--tx);z-index:2}
.tr-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.tr-row .btn{min-width:48px}
.time{font:600 15px var(--mono);color:var(--mu);margin-left:auto}
.bars-prog{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin:10px 0}
.bars-prog>i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.tl button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--s1);font:700 17px var(--mono);position:relative}
.tl button i{position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;background:var(--ac);transform-origin:left;opacity:.9}
.tl button.cur{border-color:var(--ac);background:var(--acs)}
.mk{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--s1);overflow:hidden}
.mk button{min-height:44px;border:0;background:transparent;padding:0 12px;font-weight:600;font-size:14px}
.mk button.x{padding:0 12px;color:var(--mu);border-left:1px solid var(--line)}

/* paste / preview */
.pv{padding:12px 14px}
.pv+.pv{margin-top:10px}
.pv .top{display:flex;gap:8px;align-items:center}
.pv .top input{flex:1}
.pv .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pv .kv.three{grid-template-columns:1fr 1fr 1fr}
.pv small.lb{display:block;font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.linkrow{display:flex;gap:8px;align-items:center;font:13px var(--mono);color:var(--mu);margin-top:8px;word-break:break-all}

/* share view */
.sh-item{padding:14px 0;border-bottom:1px solid var(--line)}
.sh-item .t{font:600 24px/1.15 var(--ser)}
.sh-item .n{font:600 14px var(--mono);color:var(--mu);margin-right:8px}
.sh-item .rm{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sh-item .rm span{padding:5px 10px;border-radius:8px;background:var(--s2);font-size:14px;font-weight:600}
.sh-cue{padding:12px 0;border-bottom:1px solid var(--line);font:italic 500 20px var(--ser);color:var(--ac)}
@media print{#tabbar{display:none}}
</style>
</head>
<body>
<div id="app"><div id="main"></div><nav id="tabbar" aria-label="Main"></nav></div>
<div id="toast" role="status" aria-live="polite"></div>

var ICON = {

// Scale the chart so the whole thing fits without scrolling. Two columns on wide screens if still too long.
function fitChart(box) {
  var inner = box.firstElementChild;
  if (!inner || !inner.classList.contains('chart')) return;
  var MIN = 13, MAX = Math.max(26, Math.min(64, Math.round(box.clientWidth / 11)));
  box.classList.remove('scroll');
  function set(px) { inner.style.setProperty('--fs', px + 'px'); }
  function fits() { return inner.scrollHeight <= box.clientHeight + 1 && inner.scrollWidth <= box.clientWidth + 1; }
  function search() {
    set(MIN);
    if (!fits()) return false;
    var lo = MIN, hi = MAX;
    set(hi);
    if (fits()) return true;
    while (hi - lo > 0.5) { var mid = (lo + hi) / 2; set(mid); if (fits()) lo = mid; else hi = mid; }
    set(lo);
    return true;
  }
  inner.classList.toggle('narrow', box.clientWidth < 640);
  inner.classList.remove('cols2x');
  if (search()) return;
  if (box.clientWidth >= 900) {
    inner.classList.add('cols2x'); inner.classList.remove('narrow');
    if (search()) return;
    inner.classList.remove('cols2x'); inner.classList.toggle('narrow', box.clientWidth < 640);
  }
  set(MIN);
  box.classList.add('scroll');
}

  YTAPI = new Promise(function (res, rej) {
    var prev = window.onYouTubeIframeAPIReady, done = false;
    window.onYouTubeIframeAPIReady = function () { done = true; if (prev) try { prev(); } catch (e) { /* ignore */ } res(); };
    var sc = document.createElement('script');

// Generic transport: -5s, A, B, clear, speeds. ad = {get(), seek(t), rates(), setRate(r), getRate()}
function transport(ad) {

  var aBtn = h('button', { class: 'btn', text: 'A', 'aria-label': 'Set loop start', onclick: function () { A = ad.get(); if (B != null && B <= A) B = null; paint(); } });
  var bBtn = h('button', { class: 'btn', text: 'B', 'aria-label': 'Set loop end', onclick: function () { var t = ad.get(); if (A == null) { toast('Set A first.'); return; } if (t <= A) { toast('B must be after A.'); return; } B = t; paint(); ad.seek(A); } });
  var clr = h('button', { class: 'btn ghost', text: 'Clear', 'aria-label': 'Clear loop', onclick: function () { A = B = null; paint(); } });
  var back5 = h('button', { class: 'btn', text: '−5 s', 'aria-label': 'Back 5 seconds', onclick: function () { ad.seek(Math.max(0, ad.get() - 5)); } });

  el.appendChild(h('div', { class: 'tr-row' }, back5, aBtn, bBtn, clr, time));
  el.appendChild(speeds);
  function paint() {

    });
  }

    body.push(h('h2', { class: 'sec', text: 'Change connection' }));
  } else {
    body.push(h('p', { class: 'mu', text: 'The app works on this device without it. Connect to keep your sets and songs in your Google Sheet and share them between your iPhone and iPad. Easiest is the Open Worship button in HQ.' }));
  }
  body.push(h('label', { class: 'f' }, h('span', { text: 'Address' }), url), h('label', { class: 'f' }, h('span', { text: 'Code' }), code), msg, h('div', { class: 'sp' }));
  var go1 = h('button', { class: 'btn ' + (S.conn ? '' : 'pri ') + 'block', text: 'Connect', onclick: function () {
    var u = url.value.trim(), k = code.value.trim();
    if (!/^https?:\/\//.test(u)) { msg.textContent = 'Paste the full address, starting with https://'; return; }
    if (!k) { msg.textContent = 'Enter the secret code.'; return; }
    msg.style.color = 'var(--mu)'; msg.textContent = 'Checking…'; go1.disabled = true;
    apiGet({ url: u, token: k }, 'wsets').then(function (j) {
      go1.disabled = false;
      if (j.error) { msg.style.color = 'var(--bad)'; msg.textContent = plainError(j); return; }
      saveConn({ url: u, token: k }); s.close(); toast('Connected'); syncAll();
    }).catch(function (e) { go1.disabled = false; msg.style.color = 'var(--bad)'; msg.textContent = e && e.kind === 'network' ? 'That address cannot be opened. Check it and your internet.' : plainError(e); });
  } });
  body.push(go1);
  if (S.conn) body.push(h('div', { class: 'sp' }), h('button', { class: 'btn bad ghost block', text: 'Disconnect', onclick: function () { saveConn(null); S.sync = { state: 'idle', msg: '' }; s.close(); render(true); toast('Disconnected. Your data stays on this device.'); } }));
  body.push(h('p', { class: 'mu small', style: 'margin-top:16px', text: 'Worship version ' + APP_VERSION + ' · ' + live(S.songs).length + ' songs · ' + live(S.sets).length + ' sets on this device' }));
  var s = sheet(body);
}

/* ---------- start ---------- */
var origRender = render;
render = function (keep, soft) {
  if (HASH.share) {
    var main = $('#main'); main.innerHTML = ''; main.appendChild(shareView(HASH.share)); return;
  }
  origRender(keep, soft);
};

function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  navigator.serviceWorker.register('sw.js').then(function () {
    navigator.serviceWorker.ready.then(function () { render(true, true); });
  }).catch(function () { /* the app still works without offline support */ });
}

window.addEventListener('hashchange', function () { if (/share=|connect=/.test(location.hash)) location.reload(); });
window.addEventListener('error', function (e) { try { console.error(e.message); } catch (x) { /* ignore */ } });

function start() {
  if (HASH.share) document.body.classList.add('share');
  render();
  registerSW();
  if (HASH.connectNote) toast(HASH.connectNote, 5000);
  if (!HASH.share && S.conn) syncAll();
  else updateSyncUI();
}
start();
// handy for debugging on a computer
window.WS = { S: S, go: go, setTab: setTab, openStage: openStage, commitSong: commitSong, render: render };
}());
</script>
